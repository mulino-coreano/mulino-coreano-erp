plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mulinocoreano'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    codegen
    main.java.srcDir layout.buildDirectory.dir('generated/sources/jooq')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'

    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    compileOnly 'jakarta.xml.bind:jakarta.xml.bind-api'
    codegenImplementation 'org.jooq:jooq-codegen'
    codegenImplementation 'org.flywaydb:flyway-core'
    codegenImplementation 'org.flywaydb:flyway-database-postgresql'
    codegenImplementation 'org.testcontainers:testcontainers-postgresql'
    codegenRuntimeOnly 'org.postgresql:postgresql'
    codegenRuntimeOnly 'org.slf4j:slf4j-simple'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    testImplementation platform('io.cucumber:cucumber-bom:8.0.1')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.register('generateJooq', JavaExec) {
    description = 'Generate typed SQL metadata from migrations in a disposable PostgreSQL 18 container.'
    group = 'build'
    dependsOn tasks.named('codegenClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.codegen.runtimeClasspath
    mainClass = 'com.mulinocoreano.codegen.GenerateJooq'
    inputs.files(fileTree('src/main/resources/db/migration'))
    inputs.files(sourceSets.codegen.output)
    outputs.dir(layout.buildDirectory.dir('generated/sources/jooq'))
    args file('src/main/resources/db/migration').absolutePath,
            layout.buildDirectory.dir('generated/sources/jooq').get().asFile.absolutePath
    systemProperty 'org.jooq.no-logo', 'true'
    systemProperty 'org.jooq.no-tips', 'true'
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateJooq')
}

tasks.named('test') {
    // cucumber-junit-platform-engine auto-discovers .feature files straight off the classpath
    // and runs them directly, bypassing ScenarioSuite's own "scenario" @Tag entirely (its pickles
    // carry only their own Gherkin tags: @sit/@uat/@pending/@MM/...). useJUnitPlatform's
    // excludeTags 'scenario' therefore never matches them, and excludeEngines 'cucumber' was
    // verified (via an init-script dump of the resolved JUnitPlatformOptions, confirming
    // excludeEngines=[cucumber] was actually set) to NOT stop Gradle's test worker from still
    // invoking the engine for classpath-resource-selected .feature files. Cucumber's own
    // cucumber.filter.tags is the only wiring that reaches this path.
    //
    // An earlier version of this filter excluded by KNOWN tag names ("not @sit and not @uat and
    // not @pending"), which is a convention, not a guarantee: a future scenario tagged with
    // something else, or left untagged, would slip through that exclusion and execute here.
    // Instead, require an INCLUDE match on a sentinel tag that no real scenario should ever
    // carry. Cucumber tag filters are an allowlist unless explicitly negated, so this matches
    // nothing regardless of what tags any scenario -- present or future -- actually has; only a
    // scenario author deliberately typing this exact sentinel tag could defeat it.
    useJUnitPlatform { excludeTags 'demo-e2e', 'scenario' }
    systemProperty 'cucumber.filter.tags', '@do-not-tag-scenarios-with-this--unit-test-task-must-run-zero'
}

// Explicit acceptance suite: requires disposable PostgreSQL 18, Node dependencies and host Zig CLI.
tasks.register('demoE2eTest', Test) {
    description = 'Run real HTTP/MCP/runner/CLI acceptance with simulated identity provider and model.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'demo-e2e' }
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

// SAP-style scenario suites (Cucumber, Korean Gherkin). SIT runs a scripted agent against
// the real backend; UAT runs the same scripts with a real harness/model and costs money;
// pendingScenarios dry-runs @pending scripts so an unimplemented feature still compiles.
//
// Selecting ScenarioSuite via useJUnitPlatform{includeTags 'scenario'} (as originally drafted)
// was verified broken: junit-platform-suite-engine builds its nested Cucumber discovery request
// by reusing the SAME PostDiscoveryFilters as the outer request. An outer includeTags 'scenario'
// filter is then also applied inside the suite, where no pickle carries a "scenario" tag (only
// their own Gherkin @sit/@uat/@pending/...), so nothing matches and the suite engine raises
// NoTestsDiscoveredException before Cucumber's own tag filter ever runs. Selecting the class by
// file pattern instead avoids adding any outer tag filter, so the nested discovery is unconstrained
// and Cucumber's own cucumber.filter.tags (below) is the only filter that applies.
def scenarioTask = { String taskName, String tags, String agent, boolean dryRun ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Cucumber scenarios: ${tags}"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/ScenarioSuite.class'
        useJUnitPlatform()
        systemProperty 'cucumber.filter.tags', tags
        systemProperty 'mulino.scenario.agent', agent
        if (dryRun) systemProperty 'cucumber.execution.dry-run', 'true'
        outputs.upToDateWhen { false }
        testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
    }
}
scenarioTask('sitTest', '@sit and not @pending', 'scripted', false)
scenarioTask('uatTest', '@uat and not @pending', 'live', false)
scenarioTask('pendingScenarios', '@pending', 'scripted', true)
