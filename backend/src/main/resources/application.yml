spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mulino_coreano}
    username: ${DB_USERNAME:mulino_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    disable-swagger-default-url: true

mulino:
  local-auth:
    service-secret: ${MULINO_LOCAL_SERVICE_SECRET:}

agent:
  runtime:
    default: ${MULINO_AGENT_RUNTIME:CODEX}
