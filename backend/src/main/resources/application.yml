spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mulino_coreano}
    username: ${DB_USERNAME:mulino_app}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

# PoC 로컬 신원. Auth0/OAuth는 보류(#21·#22). 역할 헤더와 실행기 토큰만 인정한다.
mulino:
  local-auth:
    issuer: https://local.mulino.test/
    # 비워 두면 실행기(worker) 인증 경로를 열지 않는다.
    worker-token: ${MULINO_WORKER_TOKEN:}
  # 서버가 스스로 예약하는 Run의 런타임(CLAUDE | CODEX). 모델 이름은 실행기 설정이다.
  execution:
    runtime: ${MULINO_AGENT_RUNTIME:CODEX}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    disable-swagger-default-url: true
