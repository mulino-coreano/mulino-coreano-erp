spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mulino_coreano}
    username: ${DB_USERNAME:mulino_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration