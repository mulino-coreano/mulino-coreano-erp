spring.application.name=backend-test
mulino.local-auth.worker-token=test-worker-token
# Many cached test contexts otherwise each reserve ten idle connections against PostgreSQL's
# default 100-client limit. Four connections still cover the two-worker concurrency fixtures.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
# Shared extension operators must survive disposable test-schema cleanup.
spring.flyway.init-sqls=CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public
